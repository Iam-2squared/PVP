name: Windows on-demand host checks

on:
  push:
    branches: [feature/windows-on-demand-public-host]
  pull_request:
    paths:
      - "Start-PVP-Public.bat"
      - "Stop-PVP-Public.bat"
      - "tools/windows_public/**"
      - "scripts/battle/profile_store.gd"
      - "scripts/frontend/start_home.gd"
      - "tools/test_frontend_battle.gd"
      - ".github/workflows/pvp-local-host-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-host:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Parse Windows PowerShell scripts
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($file in @("tools/windows_public/Start-PVP-Public.ps1", "tools/windows_public/Stop-PVP-Public.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host $_.ToString() }
              throw "PowerShell parse errors in $file"
            }
          }

      - name: Download official Godot 4.6.3 Windows editor
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip"
          Invoke-WebRequest -Uri $url -OutFile godot.zip -UseBasicParsing
          Expand-Archive godot.zip -DestinationPath godot-bin -Force
          $godot = (Get-ChildItem godot-bin -Filter "Godot_v4.6.3-stable_win64.exe" -Recurse | Select-Object -First 1).FullName
          if (-not $godot) { throw "Godot 4.6.3 not present" }
          Write-Output $godot | Set-Content godot-path.txt

      - name: Import project and test portable recovery
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $godot = Get-Content godot-path.txt -Raw
          $godot = $godot.Trim()
          & $godot --headless --editor --path . --import
          if ($LASTEXITCODE -ne 0) { throw "Godot import failed" }
          & $godot --headless --path . --script res://tools/test_frontend_battle.gd
          if ($LASTEXITCODE -ne 0) { throw "Frontend recovery and server-profile tests failed" }
