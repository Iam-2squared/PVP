name: Windows on-demand host checks

on:
  push:
    branches: [feature/windows-on-demand-public-host, fix/windows-godot-console-import, fix/godot-web-nothreads-templates]
  pull_request:
    paths:
      - "Start-PVP-Public.bat"
      - "Stop-PVP-Public.bat"
      - "tools/windows_public/**"
      - "scripts/battle/profile_store.gd"
      - "scripts/frontend/start_home.gd"
      - "tools/test_frontend_battle.gd"
      - ".github/workflows/pvp-local-host-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-syntax:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Parse Windows PowerShell scripts
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($file in @("tools/windows_public/Start-PVP-Public.ps1", "tools/windows_public/Stop-PVP-Public.ps1", "tools/windows_public/Install-WebTemplates.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host $_.ToString() }
              throw "PowerShell parse errors in $file"
            }
          }

  windows-godot-import:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download official Godot Windows editor
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip"
          Invoke-WebRequest -Uri $url -OutFile godot.zip -UseBasicParsing
          Expand-Archive godot.zip -DestinationPath godot-bin -Force
          $console = "godot-bin/Godot_v4.6.3-stable_win64_console.exe"
          if (-not (Test-Path $console)) { throw "Official release did not include console Godot" }
          & $console --version
          if ($LASTEXITCODE -ne 0) { throw "Console Godot --version failed" }
      - name: Import PVP resources on Windows via console executable
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $console = (Resolve-Path "godot-bin/Godot_v4.6.3-stable_win64_console.exe").Path
          & $console --headless --path . --import --log-file "windows-godot-import.log"
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            if (Test-Path "windows-godot-import.log") { Get-Content "windows-godot-import.log" -Tail 70 }
            throw "Windows Godot import failed: $exitCode"
          }
          & $console --headless --path . --script res://tools/test_frontend_battle.gd
          if ($LASTEXITCODE -ne 0) { throw "Windows GDScript regression test failed" }

      - name: Install real no-thread Web templates and export with Godot 4.6.3
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $templateDir = Join-Path $env:APPDATA "Godot/export_templates/4.6.3.stable"
          $archive = Join-Path $env:RUNNER_TEMP "Godot_v4.6.3-stable_export_templates.zip"
          & ./tools/windows_public/Install-WebTemplates.ps1 -TemplateDir $templateDir -ArchiveCache $archive -NonInteractive
          $release = Join-Path $templateDir "web_nothreads_release.zip"
          $debug = Join-Path $templateDir "web_nothreads_debug.zip"
          if (-not (Test-Path $release) -or -not (Test-Path $debug)) { throw "Correct no-thread export templates are missing" }
          $console = (Resolve-Path "godot-bin/Godot_v4.6.3-stable_win64_console.exe").Path
          $out = Join-Path $env:RUNNER_TEMP "pvp-web-export"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          & $console --headless --path . --export-release Web (Join-Path $out "index.html")
          if ($LASTEXITCODE -ne 0) { throw "Web export failed after template installation" }
          foreach ($asset in @("index.html","index.js","index.pck","index.wasm")) {
            if (-not (Test-Path (Join-Path $out $asset))) { throw "Missing expected Web asset $asset" }
          }
          Write-Host "Godot no-thread Web export succeeded."

  godot-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download official Godot 4.6.3 Linux editor
        run: |
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.6.3-stable_linux.x86_64
          /tmp/godot-bin/Godot_v4.6.3-stable_linux.x86_64 --version
      - name: Import project and test portable recovery
        run: |
          set -euo pipefail
          /tmp/godot-bin/Godot_v4.6.3-stable_linux.x86_64 --headless --editor --path . --import
          /tmp/godot-bin/Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script res://tools/test_frontend_battle.gd
